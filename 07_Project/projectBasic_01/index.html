<body class="body" style="background-color: rgb(1, 0, 0);">

        <div class="div1">
            <button id="button1" style="background-color: pink;">

            <button id="button2" style="background-color: greenyellow">

            <button id="button3" style="background-color: lightgray">

            <button id="button4" style="background-color: lightskyblue">

            </button>

    <script>

        const button=document.querySelectorAll('.div1');
        const body=document.querySelector('.body');
        // console.log(button); 
        // console.log(body);

        button.forEach((val)=>{
            // console.log(val);

            val.addEventListener('click',function(e){

                console.log(e.target);

                if(e.target.id==="button1"){
                    body.style.backgroundColor="pink"

                }
                if(e.target.id==="button2"){
                    body.style.backgroundColor="greenyellow"
                }
                if(e.target.id==="button3"){
                    body.style.backgroundColor="lightgray"
                }
                if(e.target.id==="button4"){
                    body.style.backgroundColor="lightskyblue"
                }
                

            })






        });
